{% set version = environ['ALPHALENS_VERSION'] %}

package:
  name: alphalens-reloaded
  version: {{ version }}

source:
  url: {{ environ['ALPHALENS_SDIST_URL'] }}
  sha256: {{ environ['ALPHALENS_SDIST_SHA256'] }}

build:
  number: 0
  skip: true  # [py<311 or py>=316]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=54
    - setuptools_scm >=6.2
  run:
    - python >=3.11,<3.16
    - numpy >=1.23.5  # [py<312]
    - numpy >=1.26.0  # [py>=312]
    - pandas >=1.5.0,<4.0  # [py<315]
    - pandas >=3.0,<4.0  # [py>=315]
    - pytz
    - tzdata
    - matplotlib >=1.4.0
    - scipy >=0.14.0
    - seaborn >=0.6.0
    - statsmodels >=0.6.1
    - ipython >=3.2.3
    - empyrical-reloaded >=0.5.7

test:
  imports:
    - alphalens
  commands:
    - python -c "import numpy as np; import pandas as pd; from alphalens.performance import cumulative_returns; assert np.allclose(cumulative_returns(pd.Series([0.1, -0.1])), [1.1, 0.99])"

about:
  home: https://alphalens.ml4trading.io
  summary: Performance analysis of predictive (alpha) stock factors
  license: Apache-2.0
  license_file: LICENSE
