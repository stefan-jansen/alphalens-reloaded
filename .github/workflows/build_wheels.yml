name: PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: 'Package Index'
        required: true
        default: 'PYPI'
        options: [ 'TESTPYPI', 'PYPI' ]
      version:
        description: 'Version tag to build'
        required: true
      publish:
        description: 'Publish validated distributions'
        type: boolean
        default: false

jobs:
  dist:
    name: Package source distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout alphalens
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: pipx run build

      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python .github/scripts/prepare_conda_source.py dist --expected-version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          path: dist/*

      - name: Check metadata
        run: pipx run twine check dist/*

  upload_pypi:
    if: ${{ inputs.publish }}
    needs: [ dist ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: dist

      - name: Publish to PyPI
        if: ${{ github.event.inputs.target  == 'PYPI' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to PyPI - Test
        if: ${{ github.event.inputs.target  == 'TESTPYPI' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TESTPYPI_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
