name: Anaconda

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to build
        required: true
        type: string
      publish:
        description: Publish the verified packages to Anaconda
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || inputs.version }}
      - uses: astral-sh/setup-uv@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: '3.11'
          activate-environment: recipe
          channels: conda-forge,ml4t
          channel-priority: strict
      - name: Prepare selected source distribution
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          uv build --sdist --out-dir dist
          python .github/scripts/prepare_conda_source.py dist --expected-version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Build and test Conda package
        run: |
          conda install --name recipe --yes conda-build conda-verify anaconda-client
          conda run --no-capture-output --name recipe conda-build --no-anaconda-upload --output-folder packages --python "${{ matrix.python }}" conda/recipe
      - uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            packages/**/*.conda
            packages/**/*.tar.bz2
          if-no-files-found: error
      - name: Publish verified packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          find packages -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -exec anaconda upload -l main -u ml4t {} +
