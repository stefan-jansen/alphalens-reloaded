name: Test Wheels

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git revision to build and test
        required: true
        type: string
  workflow_call:
    inputs:
      test-os:
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      ref:
        required: true
        type: string

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          uv build --out-dir dist
          uvx twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.test-os || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source-sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-distributions
          path: dist
      - name: Install and test the built wheel
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}"
          wheel=$(find dist -name '*.whl')
          uv pip install "${wheel}[test]"
          uv run --no-sync python -c "import alphalens; assert 'site-packages' in alphalens.__file__"
          uv run --no-sync pytest -o pythonpath= tests/ -n 2
